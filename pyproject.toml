[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-qdrant-sync"
version = "0.5.1"
description = "Process GitHub repositories into Qdrant vector collections."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "langchain>=1.2.0",
    "langchain-openai>=1.1.3",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.1",
    "langchain-core>=1.2.1",
    "langchain-text-splitters>=1.1.0",
    "qdrant-client>=1.18.0",
    "openai>=2.13.0",
    "tiktoken>=0.12.0",
    "numpy>=2.3.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "mistralai>=1.9.11",
    "sentence-transformers>=5.2.0",
    "pymupdf>=1.26.7",
    "pypdf>=6.4.2",
    "typer>=0.25.1",
    "rich>=14.3.4",
    "textual>=8.2.7,<9",
    "ruamel.yaml>=0.18.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.9",
    "pylint>=4.0.4",
    "isort>=7.0.0",
]

[project.scripts]
github-qdrant-sync = "github_qdrant_cli:main"

[project.urls]
Repository = "https://github.com/maholick/github-qdrant-sync"

[tool.setuptools]
py-modules = [
    "github_qdrant_cli",
    "github_qdrant_quality",
    "github_qdrant_tui",
    "github_to_qdrant",
    "pdf_processor",
    "rag_retrieval",
]
